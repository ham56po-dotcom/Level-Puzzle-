<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسة - ألغاز ومعلومات</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-option {
            background: #1e293b;
            border: 2px solid #334155;
            transition: all 0.2s ease;
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        .btn-option.correct {
            background-color: #15803d !important;
            border-color: #22c55e !important;
            color: white;
        }
        .btn-option.wrong {
            background-color: #b91c1c !important;
            border-color: #ef4444 !important;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card text-center">
        <!-- الشريط العلوي -->
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
            <span class="bg-amber-500/20 text-amber-400 font-bold px-3 py-1 rounded-full text-sm">💡 قسم الثقافة والألغاز</span>
            <span id="question-count" class="text-amber-400 font-bold">سؤال 1 من 5</span>
        </div>

        <!-- منطقة السؤال -->
        <div id="quiz-box">
            <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-100 leading-relaxed">جاري تحميل السؤال...</h2>
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6">
                <!-- الإجابات -->
            </div>
        </div>

        <!-- نتيجة التحدي -->
        <div id="result-box" class="hidden my-4">
            <div class="text-5xl mb-3">🎉</div>
            <h3 class="text-2xl font-bold mb-2">ممتاز! أنهيت ألغاز اليوم</h3>
            <p id="score-text" class="text-lg text-slate-300 mb-6">جمعت نقاط جديدة!</p>
            <button onclick="location.reload()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl mb-3">إعادة التحدي 🔄</button>
        </div>

        <!-- زر العودة -->
        <a href="index.html" class="inline-block text-slate-400 hover:text-white text-sm mt-2 transition">← العودة للرئيسية</a>
    </div>

    <script>
        const questions = [
            { question: "ما هي أطول دولة في العالم من حيث المساحة؟", options: ["روسيا", "كندا", "الصين", "أمريكا"], correct: 0 },
            { question: "ما هو العنصر الأساسي للتنفس والذي يشكل جزءاً كبيراً من الهواء؟", options: ["الأكسجين", "النيتروجين", "الهيدروجين", "الكربون"], correct: 1 },
            { question: "ما هي عاصمة جمهورية مصر العربية؟", options: ["الإسكندرية", "القاهرة", "الجيزة", "أسوان"], correct: 1 },
            { question: "أين تقع أهرامات الجيزة؟", options: ["السودان", "مصر", "المغرب", "العراق"], correct: 1 },
            { question: "ما أسرع كائن حي على وجه الأرض؟", options: ["الفهد", "صقر الشاهين", "الأسد", "الغزال"], correct: 1 }
        ];

        let currentIndex = 0;
        let score = 0;

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                showResults();
                return;
            }

            const q = questions[currentIndex];
            document.getElementById('question-count').innerText = `سؤال ${currentIndex + 1} من ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "btn-option w-full py-3 px-4 rounded-xl text-right text-slate-200 font-medium";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const container = document.getElementById('options-container');
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            const correctIdx = questions[currentIndex].correct;

            if (selected === correctIdx) {
                btn.classList.add('correct');
                score += 10;
            } else {
                btn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function showResults() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('score-text').innerText = `جمعت ${score} نقطة في معلوماتك العامة! 🎉`;
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
