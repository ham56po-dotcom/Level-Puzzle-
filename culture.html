<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جلسة - بنك الثقافة العامة (+1000 سؤال)</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { touch-action: manipulation; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-option {
            background: #1e293b;
            border: 2px solid #334155;
            transition: all 0.2s ease;
        }
        .btn-option:active { transform: scale(0.98); }
        .btn-option.correct { background-color: #15803d !important; border-color: #22c55e !important; color: white; }
        .btn-option.wrong { background-color: #b91c1c !important; border-color: #ef4444 !important; color: white; }
    </style>
</head>
<body>

    <div class="card text-center">
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
            <span class="bg-amber-500/20 text-amber-400 font-bold px-3 py-1 rounded-full text-sm">💡 أسئلة ثقافة متجددة</span>
            <span id="question-count" class="text-amber-400 font-bold">السؤال 1</span>
        </div>

        <div id="quiz-box">
            <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-100 leading-relaxed">جاري جلب أسئلة من بنك الأسئلة...</h2>
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-6"></div>
        </div>

        <div id="result-box" class="hidden my-4">
            <div class="text-5xl mb-3">🎉</div>
            <h3 class="text-2xl font-bold mb-2">أحسنت! أنهيت الجولة</h3>
            <p id="score-text" class="text-lg text-slate-300 mb-6">جمعت نقاط جديدة!</p>
            <button onclick="fetchQuestions()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl mb-3">جولة جديدة بأسئلة مختلفة 🔄</button>
        </div>

        <a href="index.html" class="inline-block text-slate-400 hover:text-white text-sm mt-2 transition">← العودة للرئيسية</a>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;

        async function fetchQuestions() {
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('question-text').innerText = "جاري جلب أسئلة جديدة من بنك الأسئلة...";
            document.getElementById('options-container').innerHTML = "";
            currentIndex = 0;
            score = 0;

            try {
                // جلب 10 أسئلة عشوائية من بنك أسئلة مفتوح ضخم
                const res = await fetch('https://opentdb.com/api.php?amount=10&type=multiple');
                const data = await res.json();
                
                questions = data.results.map(q => {
                    let answers = [...q.incorrect_answers, q.correct_answer];
                    answers.sort(() => Math.random() - 0.5);
                    return {
                        question: q.question,
                        options: answers,
                        correct: answers.indexOf(q.correct_answer)
                    };
                });
                loadQuestion();
            } catch (e) {
                // أسئلة بديلة في حال عدم توفر الاتصال
                questions = [
                    { question: "ما هي أكبر قارة في العالم؟", options: ["آسيا", "إفريقيا", "أوروبا", "أمريكا"], correct: 0 },
                    { question: "ما هو أسرع كائن حي بري؟", options: ["الفهد", "الأسد", "الغزال", "النمر"], correct: 0 },
                    { question: "ما عاصمة جمهورية مصر العربية؟", options: ["القاهرة", "الإسكندرية", "أسوان", "الجيزة"], correct: 0 },
                    { question: "ما أطول نهر في العالم؟", options: ["نهر النيل", "الأمازون", "المرسيسباي", "السين"], correct: 0 }
                ];
                loadQuestion();
            }
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                showResults();
                return;
            }

            const q = questions[currentIndex];
            document.getElementById('question-count').innerText = `سؤال ${currentIndex + 1} من ${questions.length}`;
            document.getElementById('question-text').innerHTML = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "btn-option w-full py-3 px-4 rounded-xl text-center text-slate-200 font-medium";
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const container = document.getElementById('options-container');
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            const correctIdx = questions[currentIndex].correct;

            if (selected === correctIdx) {
                btn.classList.add('correct');
                score += 10;
            } else {
                btn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function showResults() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('score-text').innerText = `جمعت ${score} نقطة! 🎉`;
        }

        window.onload = fetchQuestions;
    </script>
</body>
</html>
