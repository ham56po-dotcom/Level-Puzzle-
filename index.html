<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسة - الصفحة الرئيسية</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .top-bar {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .coins {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
        }

        .title p {
            color: #94a3b8;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .game-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .level-badge {
            background-color: #334155;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشريط العلوي للعملات -->
        <div class="top-bar">
            <h2>🎮 ألعاب جلسة</h2>
            <div class="coins">
                💰 <span id="coinCount">100</span>
            </div>
        </div>

        <div class="title">
            <h1>اختر اللعبة</h1>
            <p>تحدى نفسك واجمع العملات!</p>
        </div>

        <!-- شبكة الألعاب -->
        <div class="grid">
            <!-- لعبة الرياضيات -->
            <a href="math.html" class="game-card">
                <div class="icon">🧮</div>
                <div class="game-title">الرياضيات</div>
                <div class="level-badge">مستوى <span id="lvlMath">1</span></div>
            </a>

            <!-- لعبة الألغاز والمعلومات -->
            <a href="culture.html" class="game-card">
                <div class="icon">💡</div>
                <div class="game-title">ألغاز ومعلومات</div>
                <div class="level-badge">مستوى <span id="lvlCulture">1</span></div>
            </a>

            <!-- لعبة الكلمات -->
            <a href="words.html" class="game-card">
                <div class="icon">🔤</div>
                <div class="game-title">تحدي الكلمات</div>
                <div class="level-badge">مستوى <span id="lvlWords">1</span></div>
            </a>

            <!-- لعبة الذاكرة -->
            <a href="memory.html" class="game-card">
                <div class="icon">🧠</div>
                <div class="game-title">الذاكرة والتركيز</div>
                <div class="level-badge">مستوى <span id="lvlMemory">1</span></div>
            </a>
        </div>
    </div>

    <script>
        // تحميل وتحديث بيانات العملات والمستويات من الـ LocalStorage
        function loadData() {
            let coins = localStorage.getItem('j_coins') || 100;
            let levels = JSON.parse(localStorage.getItem('j_levels')) || { math: 1, culture: 1, words: 1, memory: 1 };

            document.getElementById('coinCount').innerText = coins;
            document.getElementById('lvlMath').innerText = levels.math;
            document.getElementById('lvlCulture').innerText = levels.culture;
            document.getElementById('lvlWords').innerText = levels.words;
            document.getElementById('lvlMemory').innerText = levels.memory;
        }

        loadData();
    </script>
</body>
</html>
