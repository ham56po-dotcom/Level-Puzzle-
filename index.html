<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسة - الرئيسية</title>

    <!-- 🎯 أضف السطرين دول هنا -->
    <link rel="apple-touch-icon" href="https://fav.farm/🎮">
    <link rel="icon" href="https://fav.farm/🎮">
    <style>
    
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية فقاعات متحركة */
        .bg-bubbles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; overflow: hidden; pointer-events: none;
        }

        .bubble {
            position: absolute; list-style: none; display: block;
            width: 20px; height: 20px; background: rgba(255, 255, 255, 0.05);
            bottom: -150px; border-radius: 50%; animation: square 20s infinite linear;
        }

        @keyframes square {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 20%; }
        }

        .container {
            width: 100%; max-width: 500px; z-index: 1;
        }

        /* الشريط العلوي */
        .top-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            display: flex; align-items: center; gap: 10px;
        }

        .logo-area h2 {
            margin: 0; font-size: 22px;
            background: linear-gradient(to right, #fbbf24, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .actions {
            display: flex; align-items: center; gap: 10px;
        }

        .coins-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 6px 14px; border-radius: 30px;
            font-size: 16px; font-weight: bold; color: var(--primary);
            display: flex; align-items: center; gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none; color: white; font-size: 18px;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2); transform: scale(1.05);
        }

        /* الهيدر */
        .hero { text-align: center; margin-bottom: 30px; }
        .hero h1 { margin: 0; font-size: 30px; font-weight: 800; }
        .hero p { color: #cbd5e1; margin-top: 8px; font-size: 15px; }

        /* شبكة الألعاب */
        .grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 22px 15px;
            text-align: center; text-decoration: none; color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .game-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.2);
        }

        .card-icon { font-size: 45px; margin-bottom: 12px; }
        .game-title { font-weight: 700; font-size: 17px; margin-bottom: 10px; }

        .level-badge {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc; padding: 4px 12px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }

        /* نافذة الإعدادات */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: #1e293b; border: 1px solid var(--card-border);
            width: 90%; max-width: 400px; border-radius: 24px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.3s;
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .modal-header h3 { margin: 0; font-size: 20px; color: var(--primary); }

        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .toggle-btn {
            background: #334155; border: none; color: white;
            padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: bold;
        }

        .toggle-btn.on { background: #22c55e; }

        .reset-btn {
            width: 100%; background: #ef4444; color: white; border: none;
            padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- خلفية فقاعات -->
    <ul class="bg-bubbles">
        <li class="bubble" style="left: 10%; width: 80px; height: 80px; animation-delay: 0s;"></li>
        <li class="bubble" style="left: 20%; width: 30px; height: 30px; animation-delay: 2s;"></li>
        <li class="bubble" style="left: 50%; width: 60px; height: 60px; animation-delay: 4s;"></li>
        <li class="bubble" style="left: 80%; width: 100px; height: 100px; animation-delay: 1s;"></li>
    </ul>

    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="logo-area">
                <span>🎮</span>
                <h2>جلسة</h2>
            </div>
            <div class="actions">
                <div class="coins-badge">
                    🪙 <span id="coinCount">100</span>
                </div>
                <button class="icon-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
            </div>
        </div>

        <div class="hero">
            <h1>اختر التحدي 👋</h1>
            <p>تحدَّ معلوماتك، اجمع العملات واستمتع!</p>
        </div>

        <!-- شبكة الألعاب -->
        <div class="grid">
            <a href="math.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🧮</div>
                <div class="game-title">الرياضيات</div>
                <div class="level-badge">مستوى <span id="lvlMath">1</span></div>
            </a>

            <a href="culture.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">💡</div>
                <div class="game-title">ألغاز ومعلومات</div>
                <div class="level-badge">مستوى <span id="lvlCulture">1</span></div>
            </a>

            <a href="words.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🔤</div>
                <div class="game-title">تحدي الكلمات</div>
                <div class="level-badge">مستوى <span id="lvlWords">1</span></div>
            </a>

            <a href="memory.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🧠</div>
                <div class="game-title">الذاكرة والتركيز</div>
                <div class="level-badge">مستوى <span id="lvlMemory">1</span></div>
            </a>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>⚙️ الإعدادات</h3>
                <button class="icon-btn" onclick="closeSettings()">✕</button>
            </div>
            <div class="setting-row">
                <span>المؤثرات الصوتية 🔊</span>
                <button class="toggle-btn on" id="soundToggleBtn" onclick="toggleSound()">مفعل</button>
            </div>
            <div class="setting-row">
                <span>موسيقى الخلفية 🎵</span>
                <button class="toggle-btn" id="musicToggleBtn" onclick="toggleMusic()">معطل</button>
            </div>
            <button class="reset-btn" onclick="resetProgress()">إعادة ضبط التقدم 🔄</button>
        </div>
    </div>

    <script>
        let soundEnabled = localStorage.getItem('j_sound') !== 'false';
        let musicEnabled = localStorage.getItem('j_music') === 'true';
        let audioCtx = null;
        let isMusicPlaying = false;

        // تشغيل نغمة عند الضغط
        function playClickSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch(e){}
        }

        // إنشاء موسيقى هادئة وتفاعلية للعبة
        function startMusic() {
            if (!musicEnabled || isMusicPlaying) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isMusicPlaying = true;
                
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // نغمات C - E - G - C
                let noteIndex = 0;

                function playNextNote() {
                    if (!isMusicPlaying) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);

                    noteIndex = (noteIndex + 1) % notes.length;
                    setTimeout(playNextNote, 500);
                }

                playNextNote();
            } catch(e){}
        }

        function stopMusic() {
            isMusicPlaying = false;
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            localStorage.setItem('j_music', musicEnabled);
            updateUI();
            if (musicEnabled) { startMusic(); } else { stopMusic(); }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('j_sound', soundEnabled);
            updateUI();
            if(soundEnabled) playClickSound();
        }

        function updateUI() {
            const sBtn = document.getElementById('soundToggleBtn');
            const mBtn = document.getElementById('musicToggleBtn');
            const mHeaderBtn = document.getElementById('musicBtn');

            sBtn.innerText = soundEnabled ? 'مفعل' : 'معطل';
            sBtn.className = soundEnabled ? 'toggle-btn on' : 'toggle-btn';

            mBtn.innerText = musicEnabled ? 'مفعل' : 'معطل';
            mBtn.className = musicEnabled ? 'toggle-btn on' : 'toggle-btn';
            mHeaderBtn.style.opacity = musicEnabled ? '1' : '0.5';
        }

        function openSettings() { playClickSound(); document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { playClickSound(); document.getElementById('settingsModal').classList.remove('active'); }

        function resetProgress() {
            if (confirm("هل أنت تأكد من إعادة ضبط التقدم؟")) {
                localStorage.removeItem('j_coins');
                localStorage.removeItem('j_levels');
                loadData();
                closeSettings();
            }
        }

        function loadData() {
            let coins = localStorage.getItem('j_coins') || 100;
            let levels = JSON.parse(localStorage.getItem('j_levels')) || { math: 1, culture: 1, words: 1, memory: 1 };
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('lvlMath').innerText = levels.math;
            document.getElementById('lvlCulture').innerText = levels.culture;
            document.getElementById('lvlWords').innerText = levels.words;
            document.getElementById('lvlMemory').innerText = levels.memory;
        }

        // بدء التشغيل
        updateUI();
        loadData();

        // تشغيل الموسيقى عند أول لمسة للشاشة (وفق قواعد المتصفحات)
        document.body.addEventListener('click', () => {
            if (musicEnabled && !isMusicPlaying) startMusic();
        }, { once: true });
    </script>
</body>
</html>
