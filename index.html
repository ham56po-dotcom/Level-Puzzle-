<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسة - الرئيسية</title>
    <style>
        :root {
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية فقاعات متحركة */
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            list-style: none;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.05);
            bottom: -150px;
            border-radius: 50%;
            animation: square 20s infinite linear;
        }

        @keyframes square {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 20%; }
        }

        .container {
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }

        /* الشريط العلوي */
        .top-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h2 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(to right, #fbbf24, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coins-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* عنوان الصفحة */
        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero p {
            color: #cbd5e1;
            margin-top: 8px;
            font-size: 15px;
        }

        /* شبكة الألعاب */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.2);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .game-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .level-badge {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        /* نافذة الإعدادات (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--card-border);
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 20px;
            color: var(--primary);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .setting-row span {
            font-size: 16px;
        }

        .toggle-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-btn.on {
            background: #22c55e;
        }

        .reset-btn {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- خلفية فقاعات متحركة -->
    <ul class="bg-bubbles">
        <li class="bubble" style="left: 10%; width: 80px; height: 80px; animation-delay: 0s;"></li>
        <li class="bubble" style="left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 12s;"></li>
        <li class="bubble" style="left: 25%; width: 50px; height: 50px; animation-delay: 4s;"></li>
        <li class="bubble" style="left: 40%; width: 60px; height: 60px; animation-duration: 18s;"></li>
        <li class="bubble" style="left: 70%; width: 120px; height: 120px; animation-delay: 0s;"></li>
        <li class="bubble" style="left: 85%; width: 40px; height: 40px; animation-delay: 3s;"></li>
    </ul>

    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="logo-area">
                <span>🎮</span>
                <h2>جلسة</h2>
            </div>
            <div class="actions">
                <div class="coins-badge">
                    🪙 <span id="coinCount">100</span>
                </div>
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
            </div>
        </div>

        <!-- الهيدر الرئيسي -->
        <div class="hero">
            <h1>اختر التحدي 👋</h1>
            <p>تحدَّ معلوماتك، اجمع العملات واستمتع!</p>
        </div>

        <!-- شبكة الألعاب -->
        <div class="grid">
            <a href="math.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🧮</div>
                <div class="game-title">الرياضيات</div>
                <div class="level-badge">مستوى <span id="lvlMath">1</span></div>
            </a>

            <a href="culture.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">💡</div>
                <div class="game-title">ألغاز ومعلومات</div>
                <div class="level-badge">مستوى <span id="lvlCulture">1</span></div>
            </a>

            <a href="words.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🔤</div>
                <div class="game-title">تحدي الكلمات</div>
                <div class="level-badge">مستوى <span id="lvlWords">1</span></div>
            </a>

            <a href="memory.html" class="game-card" onclick="playClickSound()">
                <div class="card-icon">🧠</div>
                <div class="game-title">الذاكرة والتركيز</div>
                <div class="level-badge">مستوى <span id="lvlMemory">1</span></div>
            </a>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>⚙️ إعدادات اللعبة</h3>
                <button class="icon-btn" onclick="closeSettings()">✕</button>
            </div>
            <div class="setting-row">
                <span>المؤثرات الصوتية 🔊</span>
                <button class="toggle-btn on" id="soundToggleBtn" onclick="toggleSound()">مفعل</button>
            </div>
            <button class="reset-btn" onclick="resetProgress()">إعادة ضبط التقدم 🔄</button>
        </div>
    </div>

    <script>
        // إعدادات الصوت والبيانات
        let soundEnabled = localStorage.getItem('j_sound') !== 'false';

        function updateSoundUI() {
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                btn.innerText = 'مفعل';
                btn.classList.add('on');
            } else {
                btn.innerText = 'معطل';
                btn.classList.remove('on');
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('j_sound', soundEnabled);
            updateSoundUI();
            if(soundEnabled) playClickSound();
        }

        // إخراج صوت نغمة ناعمة باستخدام Web Audio API
        function playClickSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // نغمة D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); // نغمة A5

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        // فتح وإغلاق الإعدادات
        function openSettings() {
            playClickSound();
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            playClickSound();
            document.getElementById('settingsModal').classList.remove('active');
        }

        // إعادة ضبط التقدم
        function resetProgress() {
            if (confirm("هل أنت تأكد من إعاده ضبط جميع المستويات والعملات؟")) {
                localStorage.removeItem('j_coins');
                localStorage.removeItem('j_levels');
                loadData();
                closeSettings();
            }
        }

        // تحميل وتحديث بيانات العملات والمستويات
        function loadData() {
            let coins = localStorage.getItem('j_coins') || 100;
            let levels = JSON.parse(localStorage.getItem('j_levels')) || { math: 1, culture: 1, words: 1, memory: 1 };

            document.getElementById('coinCount').innerText = coins;
            document.getElementById('lvlMath').innerText = levels.math;
            document.getElementById('lvlCulture').innerText = levels.culture;
            document.getElementById('lvlWords').innerText = levels.words;
            document.getElementById('lvlMemory').innerText = levels.memory;
        }

        // التشغيل عند الفتح
        updateSoundUI();
        loadData();
    </script>
</body>
                    </html>
