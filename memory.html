<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جلسة - بنك اختبار الذاكرة والذكاء (+1000 سؤال)</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { touch-action: manipulation; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-option {
            background: #1e293b;
            border: 2px solid #334155;
            transition: all 0.2s ease;
        }
        .btn-option:active { transform: scale(0.98); }
        .btn-option.correct { background-color: #15803d !important; border-color: #22c55e !important; color: white; }
        .btn-option.wrong { background-color: #b91c1c !important; border-color: #ef4444 !important; color: white; }
    </style>
</head>
<body>

    <div class="card text-center">
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
            <span class="bg-purple-500/20 text-purple-400 font-bold px-3 py-1 rounded-full text-sm">🧠 تحدي الذكاء المتنوع</span>
            <span id="question-count" class="text-purple-400 font-bold">السؤال 1 من 10</span>
        </div>

        <div id="quiz-box">
            <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-100 leading-relaxed">...</h2>
            <div id="options-container" class="grid grid-cols-2 gap-3 mb-6"></div>
        </div>

        <div id="result-box" class="hidden my-4">
            <div class="text-5xl mb-3">💡</div>
            <h3 class="text-2xl font-bold mb-2">ممتاز! أتممت الاختبار</h3>
            <p id="score-text" class="text-lg text-slate-300 mb-6">جمعت نقاط جيدة!</p>
            <button onclick="startNewRound()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl mb-3">اختبار جديد 🔄</button>
        </div>

        <a href="index.html" class="inline-block text-slate-400 hover:text-white text-sm mt-2 transition">← العودة للرئيسية</a>
    </div>

    <script>
        let currentQuestion = 0;
        let score = 0;
        let correctAnswer = null;

        function generateQuestion() {
            const types = ['sequence', 'logic', 'math_pattern'];
            const type = types[Math.floor(Math.random() * types.length)];

            if (type === 'sequence') {
                let start = Math.floor(Math.random() * 20) + 1;
                let step = Math.floor(Math.random() * 8) + 2;
                let seq = [start, start + step, start + (step * 2), start + (step * 3)];
                correctAnswer = start + (step * 4);

                document.getElementById('question-text').innerText = `أكمل المتتالية العددية:\n${seq.join(" ، ")} ، ... ؟`;
            } else if (type === 'logic') {
                let factor = Math.floor(Math.random() * 5) + 2;
                let val1 = Math.floor(Math.random() * 10) + 2;
                let val2 = val1 * factor;
                let val3 = Math.floor(Math.random() * 10) + 2;
                correctAnswer = val3 * factor;

                document.getElementById('question-text').innerText = `إذا كان الرقم ${val1} يطابق ${val2}، فإن الرقم ${val3} يطابق ... ؟`;
            } else {
                let base = Math.floor(Math.random() * 6) + 2;
                let seq = [base, base * 2, base * 4, base * 8];
                correctAnswer = base * 16;

                document.getElementById('question-text').innerText = `ما هو الرقم التالي في النمط:\n${seq.join(" ، ")} ، ... ؟`;
            }

            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 14) - 7);
                if (wrong !== correctAnswer && wrong > 0 && !options.includes(wrong)) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "btn-option w-full py-3 rounded-xl text-slate-100 font-bold text-lg";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(b => b.disabled = true);

            if (selected === correctAnswer) {
                btn.classList.add('correct');
                score += 10;
            } else {
                btn.classList.add('wrong');
                buttons.forEach(b => {
                    if (parseInt(b.innerText) === correctAnswer) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < 10) {
                    document.getElementById('question-count').innerText = `السؤال ${currentQuestion + 1} من 10`;
                    generateQuestion();
                } else {
                    showResults();
                }
            }, 1000);
        }

        function startNewRound() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('question-count').innerText = `السؤال 1 من 10`;
            generateQuestion();
        }

        function showResults() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('score-text').innerText = `جمعت ${score} نقطة في التفكير والذكاء! 🎉`;
        }

        window.onload = startNewRound;
    </script>
</body>
    </html>
