<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جلسة - قسم الرياضيات</title>
    <style>
        :root { --primary: #f59e0b; --bg-dark: #0f172a; --card-bg: #1e293b; --correct: #22c55e; --wrong: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 500px; background-color: var(--card-bg); padding: 20px; border-radius: 16px; box-sizing: border-box; text-align: center; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: var(--primary); }
        .q-title { font-size: 22px; margin: 20px 0; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-opt { background: #334155; color: white; border: 2px solid #475569; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-opt.correct { background: var(--correct) !important; }
        .btn-opt.wrong { background: var(--wrong) !important; }
        .btn-next { background: var(--primary); color: black; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 15px; font-size: 16px; cursor: pointer; display: none; }
        .back-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span>🧮 قسم الرياضيات</span>
            <span>سؤال <span id="qIdx">1</span> من 5</span>
        </div>

        <div class="q-title" id="qText">جاري تحميل السؤال...</div>
        <div class="opts" id="optsBox"></div>
        <button class="btn-next" id="nextBtn" onclick="nextQ()">السؤال التالي ➔</button>
        <a href="index.html" class="back-link">⬅ العودة للرئيسية</a>
    </div>

    <script>
        let levels = JSON.parse(localStorage.getItem('j_levels')) || { math:1, culture:1, words:1, memory:1 };
        let lvl = levels.math;
        let coins = parseInt(localStorage.getItem('j_coins')) || 100;

        let qIndex = 0;
        let score = 0;
        let questions = [];

        function generateMathQuestions() {
            let list = [];
            for(let i=0; i<5; i++) {
                let n1 = Math.floor(Math.random() * (8 * lvl)) + 2;
                let n2 = Math.floor(Math.random() * (8 * lvl)) + 2;
                let ans = n1 * n2;
                let opts = [ans, ans+2, ans-3, ans+4].sort(() => Math.random() - 0.5);
                list.push({ q: `كم يساوي: ${n1} × ${n2} ؟`, ans: ans, opts: opts });
            }
            return list;
        }

        questions = generateMathQuestions();

        function renderQ() {
            let q = questions[qIndex];
            document.getElementById('qIdx').innerText = qIndex + 1;
            document.getElementById('qText').innerText = q.q;
            document.getElementById('nextBtn').style.display = 'none';

            let box = document.getElementById('optsBox');
            box.innerHTML = '';
            q.opts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.innerText = opt;
                btn.onclick = () => check(btn, opt, q.ans);
                box.appendChild(btn);
            });
        }

        function check(btn, selected, correct) {
            let btns = document.querySelectorAll('.btn-opt');
            btns.forEach(b => b.disabled = true);

            if(selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => { if(parseInt(b.innerText) === correct) b.classList.add('correct'); });
            }
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQ() {
            qIndex++;
            if(qIndex < 5) {
                renderQ();
            } else {
                let earned = score * 10;
                coins += earned;
                if(score >= 3) levels.math++;
                
                localStorage.setItem('j_coins', coins);
                localStorage.setItem('j_levels', JSON.stringify(levels));

                alert(`انتهى الدور! أجبْت صح على ${score}/5\nوحصلت على ${earned} عملة 💰`);
                window.location.href = 'index.html'; // الانتقال التلقائي لصفحة الرئيسية
            }
        }

        renderQ();
    </script>
</body>
</html>
